# =============================================
# DATUBAZE (MySQL)
# =============================================
spring.jpa.hibernate.ddl-auto=create
spring.datasource.url=jdbc:mysql://localhost:3306/market_permit_system
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 
# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


logging.level.lv.example.MarketPermitSystem=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# Faila logging
logging.file.name=logs/market-permit-system.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
 
# =============================================
# THYMELEAF
# =============================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
 
# =============================================
# E-PASTS (Gmail)
# Lai izmantotu Gmail, nepieciešams App Password:
# Google Account -> Security -> 2FA -> App Passwords
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
 
# =============================================
# FAILU AUGŠUPIELĀDE
# =============================================
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
 
# =============================================
# SERVERA UZSTĀDĪJUMI
# =============================================
server.port=8080
spring.application.name=MarketPermitSystem